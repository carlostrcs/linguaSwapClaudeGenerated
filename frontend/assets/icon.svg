<!--
  The installable-app icon: the LinguaSwap mark on the same indigo gradient as `og.svg`, so the
  home-screen icon, the social card and the app itself read as one product.

  Deliberately FULL-BLEED and square, with the mark at ~53% of the canvas. That single piece of art
  satisfies every consumer: iOS rounds the corners itself, Android masks it (the mark sits well
  inside the 80% maskable safe circle — its bounding box diagonal is ~390px of the 409px circle),
  and desktop Chrome draws it as-is. Hence `purpose: "any maskable"` in the manifest and no second,
  near-identical source file to keep in sync.

  Rasterized to PNG by `npm run icons:build` (see scripts/build-icons.mjs).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LinguaSwap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The mark from public/favicon.svg (48x46 user units), scaled to 270px tall and centred. -->
  <g transform="translate(115.15 121) scale(5.8696)">
    <path fill="#ffffff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>
</svg>
