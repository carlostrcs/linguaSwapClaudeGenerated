# Deck definitions for the library generator.
#
#   slug (the key)  -> the output filename, Data/DefaultLibraries/<slug>.json
#   name            -> MUST match the existing library name exactly. DbSeeder matches
#                      masters BY NAME, so a changed name creates a second master
#                      instead of topping up the existing one.
#   type            -> `themed` (model proposes concepts for a topic)
#                      `frequency` (top-N English content words by real usage, via wordfreq)
#   size            -> TARGET total rows. This is the growth lever: a run adds
#                      (size - existing rows) new words. Lower or equal to the current
#                      count = no-op. Raise it and re-run to grow a deck.
#   zipf_floor      -> commonness gate. A target word must score at least this in
#                      wordfreq for its language, and anything scoring 0 (i.e. not a
#                      real word) is always rejected. Lower it for decks whose words
#                      are legitimately rarer (slang), raise it for core vocabulary.

decks:
  # ---- existing themed decks (names copied verbatim from the shipped files) ----
  travel:
    name: "Travel Essentials"
    description: "Words for getting around when you travel — airport, transport, hotel and directions (English, Spanish, French, German, Italian, Portuguese)."
    type: themed
    theme: "travel: airports, transport, hotels, directions and getting around a foreign country"
    size: 250
    zipf_floor: 1.5

  food:
    name: "Restaurant & Food"
    description: "Order with confidence — restaurant, drinks and food words (English, Spanish, French, German, Italian, Portuguese)."
    type: themed
    theme: "restaurants, food, drink, cooking ingredients and eating out"
    size: 300
    zipf_floor: 1.5

  dating:
